name: Publication

# Declenche par un tag v* — c'est ce qui produit la page de telechargement —
# et manuellement, pour eprouver la chaine sans consommer de tag.
# Deux declencheurs : un tag v* pousse normalement, ou un declenchement
# manuel avec le nom du tag a publier. Le second existe parce que la session
# de developpement ne peut pousser que sa branche de travail : c'est alors le
# jeton du workflow, qui a les droits d'ecriture, qui cree le tag et la
# Release. Sans nom fourni, le declenchement manuel reste un essai a blanc.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publier:
        description: "Nom du tag à publier (ex. v0.1.0) — vide = essai sans publication"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.2"
          arch: win64_msvc2022_64
          cache: true

      - name: Environnement MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configurer
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DARCUS_BUILD_TESTS=OFF

      - name: Compiler
        run: cmake --build build

      - name: Assembler le dossier autonome
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/arcus | Out-Null
          Copy-Item build/bin/arcus.exe dist/arcus/
          Copy-Item build/bin/arcus_sample.exe dist/arcus/
          # Les traductions francaises de Qt sont necessaires : sans elles, les
          # boutons standards et les boites de fichiers s'affichent en anglais
          # au milieu d'une interface entierement francaise.
          windeployqt --release --compiler-runtime --translations fr dist/arcus/arcus.exe
          # La plateforme « offscreen » sert a la verification sans ecran
          # ci-dessous ; windeployqt ne deploie que qwindows.
          Copy-Item "$env:QT_ROOT_DIR/plugins/platforms/qoffscreen.dll" dist/arcus/platforms/
          Copy-Item docs/FORMAT.md dist/arcus/

      - name: Générer le projet d'exemple
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          & dist/arcus/arcus_sample.exe dist/arcus/exemples
          if ($LASTEXITCODE -ne 0) { throw "arcus_sample a echoue" }
          Remove-Item dist/arcus/arcus_sample.exe

      # Le zip est deroule dans un dossier vierge et le logiciel lance depuis
      # la : c'est la seule preuve qu'il demarre hors de l'arbre de
      # compilation, avec toutes ses DLL.
      - name: Vérifier le binaire hors de l'arbre de compilation
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          Compress-Archive -Path dist/arcus -DestinationPath arcus-windows-x64.zip
          $verif = Join-Path $env:RUNNER_TEMP verif
          Expand-Archive arcus-windows-x64.zip -DestinationPath $verif
          $exe = Join-Path $verif "arcus/arcus.exe"
          $capture = Join-Path $verif "capture.png"
          $exemple = Join-Path $verif "arcus/exemples/demarrage-direct.arcus"
          Start-Process -FilePath $exe -ArgumentList "--screenshot=$capture", $exemple -Wait -NoNewWindow
          if (!(Test-Path $capture)) { throw "la fenetre ne s'est pas montee hors de l'arbre" }
          Write-Host "Verification reussie : capture de $((Get-Item $capture).Length) octets"

      - name: Nommer l'archive
        shell: pwsh
        env:
          PUBLIER: ${{ inputs.publier }}
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME }
                     elseif ($env:PUBLIER) { $env:PUBLIER }
                     else { 'dev-' + $env:GITHUB_SHA.Substring(0, 7) }
          # Le tag doit correspondre a project() dans CMakeLists : v0.1.0 pour
          # 0.1.0. Publier un binaire qui annonce une autre version selle la
          # confusion pour toujours.
          if ($version -like 'v*') {
            $cmake = (Select-String -Path CMakeLists.txt -Pattern 'VERSION (\d+\.\d+\.\d+)').Matches[0].Groups[1].Value
            if ("v$cmake" -ne $version) { throw "tag $version mais project(VERSION $cmake)" }
          }
          Rename-Item arcus-windows-x64.zip "arcus-$version-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: arcus-windows-x64
          path: arcus-*-windows-x64.zip

      - name: Publier la Release
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publier != '')
        uses: softprops/action-gh-release@v2
        with:
          name: Arcus ${{ github.ref_type == 'tag' && github.ref_name || inputs.publier }}
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.publier }}
          target_commitish: ${{ github.sha }}
          files: arcus-*-windows-x64.zip
          body: |
            ## Installation

            1. Téléchargez `arcus-${{ github.ref_type == 'tag' && github.ref_name || inputs.publier }}-windows-x64.zip` ci-dessous ;
            2. décompressez-le où vous voulez ;
            3. double-cliquez `arcus.exe`. Rien d'autre à installer.

            Un projet d'exemple (démarrage direct d'un moteur, deux folios)
            est fourni dans le dossier `exemples`.

            ## Avertissement Windows SmartScreen

            Le binaire n'est pas signé numériquement. Au premier lancement,
            Windows affichera « Windows a protégé votre ordinateur » :
            cliquez **Informations complémentaires**, puis
            **Exécuter quand même**. C'est le comportement normal de Windows
            pour tout logiciel non signé.

            ## Contenu de cette version

            Schémas de commande et de puissance multi-folios, 122 symboles
            CEI 60617, ANSI et instrumentation ISA S5.1, éditeur de symboles,
            connectivité et repérage automatiques, nomenclature, bornier et
            liste des câbles, export PDF, DXF et CSV.

            Cette version ajoute le **schéma de boucle** à côté du schéma de
            commande : bandes de localisation nommées, repérage de cadre
            configurable dans les deux sens, **cartouche composable** (menu
            Projet ▸ Cartouche du dossier), bibliothèque d'instrumentation,
            câbles multipaires avec leur liste, et le repère composé
            `secteur + fonction + boucle`. Avec elles : effacer un composant
            referme le fil, remplacer un symbole garde repère et
            raccordements, rechercher/remplacer dans tout le dossier, et les
            cotations.
